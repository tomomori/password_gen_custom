<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassGen Custom v1 - パスワード生成ツール</title>
  <style>
    /* ライトテーマ（デフォルト） */
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-sub: #f8fafc;
      --bg-item: #ffffff;
      --bg-btn: #e2e8f0;
      --bg-btn-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --accent: #0284c7;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --badge-border: rgba(2, 132, 199, 0.25);
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    /* ダークテーマ */
    body.dark-mode {
      --bg-page: #0f172a;
      --bg-card: #1e293b;
      --bg-sub: #0f172a;
      --bg-item: #1e293b;
      --bg-btn: #334155;
      --bg-btn-hover: #475569;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --badge-border: rgba(56, 189, 248, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.25s, color 0.25s;
    }

    .app-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      padding: 28px;
      box-shadow: var(--shadow);
      transition: background-color 0.25s, border-color 0.25s;
    }

    /* ヘッダー */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      flex-wrap: wrap;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    .badge-secure {
      font-size: 11px;
      background: var(--badge-bg);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--badge-border);
    }

    .theme-btn {
      background-color: var(--bg-btn);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .theme-btn:hover { background-color: var(--bg-btn-hover); }

    /* パスワード出力エリア */
    .output-group {
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .output-group input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: "Consolas", "Monaco", monospace;
      font-size: 20px;
      width: 100%;
      min-width: 0;
      outline: none;
      letter-spacing: 1.5px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      background-color: var(--bg-btn);
      color: var(--text-main);
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    .icon-btn:hover { background-color: var(--bg-btn-hover); }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }

    /* 強度メーター */
    .strength-bar-container { margin-bottom: 24px; }
    .strength-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .meter-bg {
      height: 6px;
      background-color: var(--bg-sub);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s, background-color 0.3s;
    }

    /* 設定セクション */
    .section { margin-bottom: 22px; }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 文字数スライダー */
    .length-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-sub);
      color: var(--text-main);
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .step-btn:hover { background-color: var(--bg-btn); }
    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
      min-width: 0;
    }
    .length-val {
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      min-width: 48px;
      text-align: right;
    }

    /* 基本文字種 */
    .grid-basic {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .toggle-card {
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-card:hover { border-color: var(--primary); }
    .toggle-card input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 高度なルール・制限オプション */
    .rules-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rule-card {
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 11px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.45;
      cursor: pointer;
      user-select: none;
    }
    .rule-card:hover { border-color: var(--primary); }
    .rule-card input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .rule-text {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* 記号個別グリッド */
    .symbol-actions { display: flex; gap: 10px; }
    .mini-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }
    .grid-symbols {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 8px;
      background-color: var(--bg-sub);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .sym-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 4px;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .sym-item:hover { border-color: var(--primary); }
    .sym-item input { accent-color: var(--primary); cursor: pointer; }

    /* フッター */
    .app-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 13px;
    }
    .source-link {
      color: var(--accent);
      text-decoration: underline;
      overflow-wrap: anywhere;
    }
    .source-link:hover { text-decoration: none; }

    /* スマホなど横幅が狭い画面（520px以下）への最適化 */
    @media (max-width: 520px) {
      .app-card { padding: 20px 16px; }
      .app-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 10px;
        row-gap: 8px;
      }
      .title-area { display: contents; }
      .app-header h1 {
        grid-column: 1;
        grid-row: 1;
        white-space: nowrap;
      }
      .theme-btn {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
      }
      .badge-secure {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: start;
      }
      .output-group {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .output-group input {
        text-align: center;
        font-size: 18px;
        padding: 4px 0;
      }
      .action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }
      .icon-btn {
        width: 100%;
        padding: 10px;
        text-align: center;
      }
      .grid-basic { grid-template-columns: 1fr; }
      .rule-card {
        padding: 10px 12px;
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="app-header">
      <div class="title-area">
        <h1>PassGen Custom</h1>
        <span class="badge-secure">ローカル完結・暗号乱数生成</span>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span>
      </button>
    </div>

    <div class="output-group">
      <input type="text" id="passwordOutput" readonly aria-label="生成されたパスワード">
      <div class="action-buttons">
        <button class="icon-btn" onclick="generatePassword()" title="再生成">↻ 再生成</button>
        <button class="icon-btn btn-primary" id="copyBtn" onclick="copyPassword()">📋 コピー</button>
      </div>
    </div>

    <div class="strength-bar-container">
      <div class="strength-meta">
        <span>セキュリティ強度</span>
        <span id="strengthText">強力</span>
      </div>
      <div class="meter-bg">
        <div class="meter-fill" id="strengthMeter"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <span>パスワードの文字数</span>
        <span class="length-val" id="lengthDisplay">12文字</span>
      </div>
      <div class="length-row">
        <button class="step-btn" onclick="changeLength(-1)" aria-label="文字数を減らす">−</button>
        <input type="range" id="lengthSlider" min="6" max="40" value="12" oninput="updateLength(this.value)">
        <button class="step-btn" onclick="changeLength(1)" aria-label="文字数を増やす">＋</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span>基本の文字種</span></div>
      <div class="grid-basic">
        <label class="toggle-card"><input type="checkbox" id="useLower" checked onchange="generatePassword()"> 小文字 (a-z)</label>
        <label class="toggle-card"><input type="checkbox" id="useUpper" checked onchange="generatePassword()"> 大文字 (A-Z)</label>
        <label class="toggle-card"><input type="checkbox" id="useNum" checked onchange="generatePassword()"> 数字 (0-9)</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span>制限・ルール設定</span></div>
      <div class="rules-list">
        <label class="rule-card">
          <input type="checkbox" id="startWithLetter" checked onchange="generatePassword()">
          <span class="rule-text">先頭を英字にする（先頭に記号・数字を使わない）</span>
        </label>
        <label class="rule-card">
          <input type="checkbox" id="excludeSimilar" checked onchange="generatePassword()">
          <span class="rule-text">紛らわしい文字を除外：ゼロ(0)・イチ(1)・アイ(iI)・エル(lL)・オー(oO)</span>
        </label>
      </div>
    </div>

    <div class="section" style="margin-bottom: 0;">
      <div class="section-title">
        <span>使用する記号（個別に選択）</span>
        <div class="symbol-actions">
          <button class="mini-link" onclick="toggleAllSymbols(true)">すべて選択</button>
          <button class="mini-link" onclick="toggleAllSymbols(false)">すべて解除</button>
        </div>
      </div>
      <div class="grid-symbols" id="symbolGrid"></div>
    </div>

    <footer class="app-footer">
      <a
        class="source-link"
        href="https://github.com/tomomori/password_gen_custom"
        onclick="return confirmSourceLink()"
      >ソースコードとドキュメント</a>
    </footer>
  </div>

  <script>
    const LOWER = "abcdefghijklmnopqrstuvwxyz";
    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const NUM = "0123456789";
    const SIMILAR_REGEX = /[01iIlLoO]/g;

    const SYMBOLS = [
      { char: "!", checked: true },
      { char: "@", checked: true },
      { char: "#", checked: true },
      { char: "$", checked: true },
      { char: "%", checked: true },
      { char: "&", checked: true },
      { char: "*", checked: true },
      { char: "-", checked: true },
      { char: "_", checked: true },
      { char: "+", checked: false },
      { char: "=", checked: false },
      { char: "?", checked: false },
      { char: "/", checked: false },
      { char: ".", checked: false },
      { char: ",", checked: false },
      { char: ":", checked: false },
      { char: ";", checked: false },
      { char: "^", checked: false },
      { char: "~", checked: false },
      { char: "(", checked: false },
      { char: ")", checked: false }
    ];

    // テーマ切り替え処理
    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark-mode");
      updateThemeButton(isDark);
      try {
        localStorage.setItem("passgen_theme", isDark ? "dark" : "light");
      } catch (error) {
        // 保存できない環境でもテーマ切り替え自体は継続する
      }
    }

    function updateThemeButton(isDark) {
      document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
      document.getElementById("themeLabel").textContent = isDark ? "Light" : "Dark";
    }

    function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem("passgen_theme");
      } catch (error) {
        // localStorageを利用できない場合はライトテーマで継続する
      }
      if (saved === "dark") {
        document.body.classList.add("dark-mode");
        updateThemeButton(true);
      }
    }

    function initSymbols() {
      const grid = document.getElementById("symbolGrid");
      SYMBOLS.forEach(item => {
        const label = document.createElement("label");
        label.className = "sym-item";
        label.innerHTML = `<input type="checkbox" class="sym-cb" value="${item.char}" ${item.checked ? "checked" : ""} onchange="generatePassword()"><span>${item.char}</span>`;
        grid.appendChild(label);
      });
    }

    function toggleAllSymbols(state) {
      document.querySelectorAll(".sym-cb").forEach(cb => cb.checked = state);
      generatePassword();
    }

    function updateLength(val) {
      document.getElementById("lengthDisplay").textContent = val + "文字";
      generatePassword();
    }

    function changeLength(delta) {
      const slider = document.getElementById("lengthSlider");
      const next = parseInt(slider.value) + delta;
      if (next >= 6 && next <= 40) {
        slider.value = next;
        updateLength(next);
      }
    }

    function getRandomIndex(max) {
      if (!Number.isInteger(max) || max <= 0) {
        throw new RangeError("max must be a positive integer");
      }

      const uint32Range = 0x100000000;
      const limit = uint32Range - (uint32Range % max);
      const arr = new Uint32Array(1);

      // 剰余による偏りを避けるため、均等に割り切れる範囲の値だけを使用する
      do {
        window.crypto.getRandomValues(arr);
      } while (arr[0] >= limit);

      return arr[0] % max;
    }

    function getRandomChar(str, randomIndex = getRandomIndex) {
      return str[randomIndex(str.length)];
    }

    function filterSimilar(str, exclude) {
      return exclude ? str.replace(SIMILAR_REGEX, "") : str;
    }

    // 画面の状態を、生成処理が扱う単純なデータへ変換する
    function readPasswordSettings() {
      return {
        length: parseInt(document.getElementById("lengthSlider").value),
        useLower: document.getElementById("useLower").checked,
        useUpper: document.getElementById("useUpper").checked,
        useNum: document.getElementById("useNum").checked,
        startWithLetter: document.getElementById("startWithLetter").checked,
        excludeSimilar: document.getElementById("excludeSimilar").checked,
        symbols: Array.from(document.querySelectorAll(".sym-cb:checked"), cb => cb.value).join("")
      };
    }

    // DOMに依存せず、設定データだけからパスワードを生成する
    function createPassword(settings, randomIndex = getRandomIndex) {
      const normalizedSettings = { ...settings };

      // 先頭を英字にする場合は、少なくとも1種類の英字を有効にする
      if (normalizedSettings.startWithLetter &&
          !normalizedSettings.useLower &&
          !normalizedSettings.useUpper) {
        normalizedSettings.useLower = true;
      }

      let lowerPool = normalizedSettings.useLower
        ? filterSimilar(LOWER, normalizedSettings.excludeSimilar)
        : "";
      const upperPool = normalizedSettings.useUpper
        ? filterSimilar(UPPER, normalizedSettings.excludeSimilar)
        : "";
      const numPool = normalizedSettings.useNum
        ? filterSimilar(NUM, normalizedSettings.excludeSimilar)
        : "";
      const symPool = normalizedSettings.symbols;

      const pools = [];
      if (lowerPool) pools.push(lowerPool);
      if (upperPool) pools.push(upperPool);
      if (numPool) pools.push(numPool);
      if (symPool) pools.push(symPool);

      // 何も選択されていない場合は小文字をデフォルトに
      if (pools.length === 0) {
        normalizedSettings.useLower = true;
        lowerPool = filterSimilar(LOWER, normalizedSettings.excludeSimilar);
        pools.push(lowerPool);
      }

      const letterPool = lowerPool + upperPool;
      const allChars = pools.join("");
      let passwordChars = [];

      if (normalizedSettings.startWithLetter && letterPool.length > 0) {
        // 1文字目を英字から決定
        const firstChar = getRandomChar(letterPool, randomIndex);
        let restChars = [];

        // 1文字目がどのプールに属するか確認し、他の選択済みプールから最低1文字ずつ確保
        pools.forEach(pool => {
          if (!pool.includes(firstChar) && restChars.length < normalizedSettings.length - 1) {
            restChars.push(getRandomChar(pool, randomIndex));
          }
        });

        // 残りを全文字種からランダムに埋める
        while (restChars.length < normalizedSettings.length - 1) {
          restChars.push(getRandomChar(allChars, randomIndex));
        }

        // 2文字目以降をシャッフル
        for (let i = restChars.length - 1; i > 0; i--) {
          const j = randomIndex(i + 1);
          [restChars[i], restChars[j]] = [restChars[j], restChars[i]];
        }

        passwordChars = [firstChar, ...restChars];
      } else {
        pools.forEach(pool => {
          if (passwordChars.length < normalizedSettings.length) {
            passwordChars.push(getRandomChar(pool, randomIndex));
          }
        });

        while (passwordChars.length < normalizedSettings.length) {
          passwordChars.push(getRandomChar(allChars, randomIndex));
        }

        for (let i = passwordChars.length - 1; i > 0; i--) {
          const j = randomIndex(i + 1);
          [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
        }
      }

      return {
        password: passwordChars.join(""),
        varietyCount: pools.length,
        settings: normalizedSettings
      };
    }

    // 生成結果と、生成時に補正された設定を画面へ反映する
    function renderPassword(result) {
      document.getElementById("useLower").checked = result.settings.useLower;
      document.getElementById("useUpper").checked = result.settings.useUpper;
      document.getElementById("passwordOutput").value = result.password;
      updateStrengthMeter(result.password, result.varietyCount);
    }

    function generatePassword() {
      const settings = readPasswordSettings();
      const result = createPassword(settings);
      renderPassword(result);
    }

    function updateStrengthMeter(pw, varietyCount) {
      const meter = document.getElementById("strengthMeter");
      const text = document.getElementById("strengthText");
      let score = 0;

      if (pw.length >= 14) score += 3;
      else if (pw.length >= 10) score += 2;
      else if (pw.length >= 8) score += 1;

      score += (varietyCount - 1);

      if (score >= 5) {
        meter.style.width = "100%";
        meter.style.backgroundColor = "#10b981";
        text.textContent = "非常に強力";
        text.style.color = "#10b981";
      } else if (score >= 3) {
        meter.style.width = "65%";
        meter.style.backgroundColor = "#0284c7";
        text.textContent = "標準・良好";
        text.style.color = "#0284c7";
      } else {
        meter.style.width = "30%";
        meter.style.backgroundColor = "#f43f5e";
        text.textContent = "弱い（文字数や種類を増やしてください）";
        text.style.color = "#f43f5e";
      }
    }

    function copyPassword() {
      const pw = document.getElementById("passwordOutput").value;
      const btn = document.getElementById("copyBtn");

      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        showCopyFailure(btn);
        return;
      }

      navigator.clipboard.writeText(pw).then(() => {
        btn.textContent = "✓ 完了！";
        setTimeout(() => { btn.textContent = "📋 コピー"; }, 1200);
      }).catch(() => {
        showCopyFailure(btn);
      });
    }

    function showCopyFailure(btn) {
      btn.textContent = "コピー失敗";
      btn.title = "生成結果を選択して手動でコピーしてください";
      setTimeout(() => {
        btn.textContent = "📋 コピー";
        btn.title = "クリップボードにコピー";
      }, 2000);
    }

    function confirmSourceLink() {
      return window.confirm(
        "下記URLを表示します。よろしいですか？\nhttps://github.com/tomomori/password_gen_custom"
      );
    }

    window.onload = () => {
      initTheme();
      initSymbols();
      generatePassword();
    };
  </script>
</body>
</html>

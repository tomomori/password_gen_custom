<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassGen Custom QUnitテスト</title>
  <link rel="stylesheet" href="./lib/qunit/qunit.css">
  <style>
    #appToggle {
      margin: 16px 0;
      padding: 8px 16px;
      cursor: pointer;
    }

    #appToggle:disabled {
      cursor: wait;
    }

    #app {
      display: none;
      width: 100%;
      height: 900px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
    }

    #app.is-visible { display: block; }
  </style>
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <button
    type="button"
    id="appToggle"
    aria-controls="app"
    aria-expanded="false"
    disabled
  >アプリ画面を表示</button>

  <script src="./lib/qunit/qunit.js"></script>
  <script>
    QUnit.config.autostart = false;
  </script>
  <script src="./password-generator.test.js"></script>
</body>
</html>
